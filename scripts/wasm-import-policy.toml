# NOTE: 't' (test) module is NOT listed here.
# Any t::* import in a release artifact is a critical violation indicating
# that soroban-sdk testutils were compiled into production code.

[exports]

# Standard Soroban contract exports emitted by stellar contract build
# for every contract (memory layout sentinels and the WASM memory export).
