# EarnProof WASM import/export allowlist policy
#
# This file is the reviewed allowlist for every symbol that may appear in a
# release WASM artifact.  The audit-wasm tool checks each built artifact
# against these entries and fails the build if any symbol is absent.
#
# Format
# ------
# [imports]  — section header; lines below are allowed host imports
# [exports]  — section header; lines below are allowed contract exports
# module::fn — an import entry (Soroban host module short-name :: function short-name)
# name       — an export entry
# Lines starting with '#' and blank lines are ignored.
#
# Soroban host module index (from soroban-env-common env.json)
# ------------------------------------------------------------
#   x  = context   i  = int     m  = map      v  = vec
#   l  = ledger    d  = call    b  = buf       c  = crypto
#   a  = address   p  = prng
#
# The 't' (test) module is intentionally absent.  Its presence in a release
# artifact means the testutils feature was compiled into production code and
# is a hard policy violation.
#
# Procedure for updating this file
# ---------------------------------
# 1. Build the contracts: stellar contract build
# 2. Run: audit-wasm --policy scripts/wasm-import-policy.toml \
#              target/wasm32v1-none/release/protocol_config.wasm \
#              target/wasm32v1-none/release/issuer_registry.wasm \
#              target/wasm32v1-none/release/proof_registry.wasm
# 3. Review every new symbol before adding it here.
# 4. Document the reason for any addition in a comment on the same line.

[imports]

