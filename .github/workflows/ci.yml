name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
      - name: Build release WASM artifacts
        run: stellar contract build
      - name: Audit WASM imports and exports
        run: |
          cargo build --manifest-path tools/audit-wasm/Cargo.toml --release --quiet
          ./target/release/audit-wasm \
            --policy scripts/wasm-import-policy.toml \
            target/wasm32v1-none/release/protocol_config.wasm \
            target/wasm32v1-none/release/issuer_registry.wasm \
            target/wasm32v1-none/release/proof_registry.wasm
